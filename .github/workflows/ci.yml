name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project metadata
        run: python -m json.tool node.config > /dev/null

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Run Python tests when present
        run: |
          if find . -path './.git' -prune -o -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            pytest
          else
            echo 'No Python tests are present.'
          fi

  node-tests:
    if: ${{ hashFiles('package-lock.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build frontend
        run: npm run build
